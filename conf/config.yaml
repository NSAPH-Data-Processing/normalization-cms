defaults:
  - _self_
  - datapaths: medicare_partd_pde
  - table_config: medicare_partd/pde   # overridden at CLI: table_config=medicaid_taf/beneficiaries

# Used by run_build_tables.py to locate conf/build_tables/{dataset}.yml
dataset: medicare_partd

# Used by run_build_tables.py. Overridden at CLI: table=beneficiaries
table: pde

# Used by run_select_variables.py and run_qc.py. Overridden at CLI: year=2018
year: 2016

hydra:
  run:
    dir: ${hydra:runtime.cwd}/logs/hydra/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.override_dirname}

