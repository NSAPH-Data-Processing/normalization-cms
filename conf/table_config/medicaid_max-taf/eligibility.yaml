title: Medicaid MAX-TAF Normalization - Eligibility
description: >
  Yearly enrollment information for Medicaid beneficiaries 1998-2018

name: eligibility
path_pattern: "${datapaths.dirs.input}/patient_summary/ps_${year}.parquet"
output_name: "eligibility_${year}"
output_dir: "${datapaths.dirs.intermediate}"

monthly_columns: true
period_col: month
n_periods: 12
monthly_pattern: '^(.+)_mo_(\d{2})$'

