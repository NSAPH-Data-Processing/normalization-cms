title: Medicaid TAF Normalization - Enrollments
description: >
  Enrollment variables from the demographic eligibility base file for a
  beneficiary in a given year. Primary keys are bene_id, bene_state_cd, year.

name: enrollments
path_pattern: "${datapaths.dirs.input}/${year}/taf_demog_elig_base_*/part-*.parquet"
output_name: "enrollment_${year}"
output_dir: "${datapaths.dirs.intermediate}"

columns:
